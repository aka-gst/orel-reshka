<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Деревня — грейбокс экономики</title>
<style>
:root{color-scheme:dark;--green:#76ff9f;--violet:#bc70ff;--gold:#ffe06b;--ink:#090510;--dim:#b7a7c4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:16px;background:radial-gradient(circle at 50% 10%,#45205f,#120a1c 48%,var(--ink));color:#f6edff;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
h1{margin:0 0 4px;font:900 26px/1 system-ui,sans-serif;letter-spacing:-.05em}
h1 span{color:var(--green);text-shadow:2px 2px #633180}
.note{margin:0 0 16px;color:var(--dim);font-size:10px;letter-spacing:.06em}
.wrap{display:grid;grid-template-columns:minmax(190px,1fr) minmax(260px,380px) minmax(210px,1fr);gap:16px;max-width:1100px;margin:0 auto;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{padding:14px;border:1px solid #a867e066;background:#110b19cc}
.panel>small{display:block;margin-bottom:9px;color:var(--dim);font-size:9px;letter-spacing:.1em}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #a867e022}
.row:last-child{border:0}
.row b{color:var(--gold);font-weight:700}
.bar{height:5px;margin-top:6px;background:#2a1b38;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.center{display:grid;justify-items:center;gap:12px}
.coin-wrap{width:min(38vw,180px);height:min(38vw,180px);perspective:900px}
.coin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform var(--spin,650ms) cubic-bezier(.2,.7,.15,1)}
.side{position:absolute;inset:0;display:grid;place-items:center;border:6px double #ffe88d;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:radial-gradient(circle at 32% 24%,#fff8 0 5%,transparent 6%),radial-gradient(circle,#f8d66c,#9d641c 70%);color:#251203;font:900 22px/1 system-ui,sans-serif}
.tails{transform:rotateY(180deg);background:radial-gradient(circle at 32% 24%,#fff 0 5%,transparent 6%),radial-gradient(circle,#d8dce4,#687080 70%)}
.controls{width:100%;display:grid;gap:8px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label,button{min-height:40px;display:grid;place-items:center;padding:6px;border:1px solid #725089;background:#171020;color:#eee3f6;font:800 10px ui-monospace,monospace;letter-spacing:.05em;cursor:pointer;text-align:center}
.choice input:checked+label{border-color:var(--gold);background:#4d3b13;color:#fff6b7}
button:disabled{opacity:.4;cursor:default}
.go{border:2px solid var(--green);background:#194d31;color:#fff;font-size:12px}
.bank{border:2px solid var(--gold);background:#4d3b13;color:#fff6b7;font-size:12px}
.pot{text-align:center;font-size:11px;color:var(--dim)}
.pot b{display:block;margin-top:2px;color:var(--gold);font:900 24px/1 system-ui,sans-serif}
.msg{min-height:32px;margin:0;text-align:center;font-size:11px;color:#d9cce2}
.build{display:grid;gap:8px}
.build article{display:grid;gap:3px;padding:9px;border:1px solid #725089;background:#171020}
.build header{display:flex;justify-content:space-between;gap:8px;font-weight:700;letter-spacing:.05em}
.build header span{color:var(--green)}
.build p{margin:0;color:var(--dim);font-size:10px}
.build button{min-height:30px;margin-top:4px;font-size:10px}
.reset{margin:16px auto 0;max-width:1100px;display:flex;justify-content:flex-end}
.reset button{min-height:26px;padding:0 12px;border-color:#5a3a70;color:#8d7c9b;font-size:9px}
</style>
</head>
<body>
<h1><span>ДЕРЕВНЯ</span> / ГРЕЙБОКС</h1>
<p class="note">Прототип для настройки экономики. Все числа — в объекте BALANCE в начале скрипта. Лидерборд отключён намеренно.</p>

<div class="wrap">
  <aside class="panel">
    <small>ДЕРЕВНЯ</small>
    <div class="row"><span>Золото</span><b id="v-gold">0</b></div>
    <div class="row"><span>Молоко</span><b id="v-milk">0</b></div>
    <div class="bar"><i id="v-bar" style="width:0"></i></div>
    <div class="row"><span>Надой</span><b id="v-rate">0</b></div>
    <div class="row"><span>Хранение</span><b id="v-cap">0</b></div>
    <div class="row"><span>Цена молока</span><b id="v-price">0</b></div>
    <div class="row"><span>Лучшая серия</span><b id="v-best">0</b></div>
  </aside>

  <section class="panel center">
    <small style="justify-self:start">РЫНОК</small>
    <div class="coin-wrap"><div id="coin" class="coin"><div class="side">ОРЁЛ</div><div class="side tails">РЕШКА</div></div></div>
    <div class="pot" id="pot-label">Партия не собрана<b id="pot">—</b></div>
    <div class="controls">
      <div class="choice">
        <input type="radio" id="heads" name="bet" value="heads" checked><label for="heads">ОРЁЛ</label>
        <input type="radio" id="tails" name="bet" value="tails"><label for="tails">РЕШКА</label>
      </div>
      <button id="go" class="go">НА РЫНОК</button>
      <button id="bank" class="bank" disabled>ПРОДАТЬ</button>
      <p id="msg" class="msg">Накопи молоко и вези его на рынок.</p>
    </div>
  </section>

  <aside class="panel">
    <small>ПОСТРОЙКИ</small>
    <div class="build" id="build"></div>
  </aside>
</div>

<div class="reset"><button id="reset">СБРОСИТЬ ПРОГРЕСС</button></div>

<script>
/* ---------- ВСЕ РЫЧАГИ БАЛАНСА ЗДЕСЬ ---------- */
const BALANCE = {
  milkPerCowPerMin: 2,     // надой одной коровы в минуту
  capPerBarn: 20,          // вместимость одного амбара
  priceBase: 1,            // золота за молоко без ярмарок
  dumpRate: 0.4,           // множитель сдачи перекупщику, без броска
  firstWin: 1.0,           // множитель после первого удачного торга
  growth: 2.0,             // во сколько раз растёт партия за каждый следующий успех
  spinMs: 650,             // длительность броска (в бою сейчас 1550)
  buildings: {
    cow:  {name:'КОРОВА',  cost:15, growth:1.55, hint:'+2 молока в минуту'},
    barn: {name:'АМБАР',   cost:25, growth:1.75, hint:'+20 к хранению'},
    fair: {name:'ЯРМАРКА', cost:40, growth:2.00, hint:'+1 золото за молоко'},
  },
};
/* ---------------------------------------------- */

const KEY = 'village-proto-v1';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) } catch { return null } };
const saved = load() || {};
const S = Object.assign({gold:0, milk:0, best:0, t:Date.now()}, saved);
// own мержим отдельно: иначе добавленная в BALANCE постройка отсутствует в сохранёнке и даёт NaN.
S.own = Object.assign(
  Object.fromEntries(Object.keys(BALANCE.buildings).map(k => [k, 0])),
  {cow:1, barn:1},
  saved.own || {}
);
let run = null, rotation = 0, busy = false;

const capacity = () => BALANCE.capPerBarn * S.own.barn;
const ratePerMin = () => BALANCE.milkPerCowPerMin * S.own.cow;
const price = () => BALANCE.priceBase + S.own.fair;
const costOf = k => Math.floor(BALANCE.buildings[k].cost * BALANCE.buildings[k].growth ** S.own[k]);
// 0 успехов — сдача перекупщику, 1 — базовая цена, дальше удвоение.
const multOf = streak => streak === 0 ? BALANCE.dumpRate : BALANCE.firstWin * BALANCE.growth ** (streak - 1);
const payout = () => run ? Math.floor(run.batch * price() * multOf(run.streak)) : 0;

const el = id => document.getElementById(id);
// Хранилище может быть недоступно (приватный режим, отключённые куки) — игра должна работать и без него.
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch {} };

function accrue(){
  const now = Date.now();
  const minutes = Math.max(0, (now - S.t) / 60000);
  S.t = now;
  S.milk = Math.min(capacity(), S.milk + ratePerMin() * minutes);
}

function render(){
  el('v-gold').textContent  = Math.floor(S.gold);
  el('v-milk').textContent  = `${Math.floor(S.milk)} / ${capacity()}`;
  el('v-bar').style.width   = `${Math.min(100, S.milk / capacity() * 100)}%`;
  el('v-rate').textContent  = `${ratePerMin()} / мин`;
  el('v-cap').textContent   = capacity();
  el('v-price').textContent = price();
  el('v-best').textContent  = S.best;

  const ready = Math.floor(S.milk);
  // Во время торга go — это «торговаться», а не «на рынок»; busy держит обе кнопки на время броска,
  // иначе секундный тик включит их прямо в полёте монеты.
  el('go').disabled   = busy || (!run && ready < 1);
  el('go').textContent = run ? `ТОРГОВАТЬСЯ (×${multOf(run.streak + 1)})` : `НА РЫНОК (${ready} молока)`;
  el('bank').disabled = busy || !run;
  el('bank').textContent = run ? `ПРОДАТЬ ЗА ${payout()}` : 'ПРОДАТЬ';

  el('pot-label').firstChild.textContent = run
    ? `Партия ${run.batch} · серия ${run.streak} · ×${multOf(run.streak)}`
    : 'Партия не собрана';
  el('pot').textContent = run ? payout() : '—';

  el('build').innerHTML = Object.entries(BALANCE.buildings).map(([k, b]) => {
    const cost = costOf(k);
    return `<article>
      <header>${b.name}<span>${S.own[k]}</span></header>
      <p>${b.hint}</p>
      <button data-buy="${k}" ${S.gold < cost ? 'disabled' : ''}>КУПИТЬ · ${cost}</button>
    </article>`;
  }).join('');
}

function toMarket(){
  if (run || busy) return;
  const batch = Math.floor(S.milk);
  if (batch < 1) return;
  S.milk -= batch;
  run = {batch, streak: 0};
  el('msg').textContent = `Собрана партия ${batch}. Перекупщик даёт ${payout()}. Торговаться — удвоение или всё пропало.`;
  save(); render();
}

function haggle(){
  if (busy || !run) return;
  busy = true;
  const bet = document.querySelector('input[name="bet"]:checked').value;
  const result = Math.random() < .5 ? 'heads' : 'tails';
  el('go').disabled = el('bank').disabled = true;
  el('msg').textContent = 'Монета в воздухе…';
  rotation += 6 * 360 + (result === 'tails' ? 180 : 0) - (rotation % 360);
  el('coin').style.setProperty('--spin', `${BALANCE.spinMs}ms`);
  el('coin').style.transform = `rotateY(${rotation}deg)`;
  setTimeout(() => {
    busy = false;
    if (result === bet) {
      run.streak++;
      if (run.streak > S.best) S.best = run.streak;
      el('msg').textContent = `Сторговался. Партия идёт за ${payout()}. Ещё раз — или продавай.`;
    } else {
      el('msg').textContent = `Не сошлись в цене. Партия ${run.batch} пропала.`;
      run = null;
    }
    save(); render();
  }, BALANCE.spinMs + 60);
}

function bank(){
  if (busy || !run) return;
  const sum = payout();
  S.gold += sum;
  el('msg').textContent = run.streak === 0
    ? `Сдал перекупщику за ${sum}. Дёшево, зато наверняка.`
    : `Продал за ${sum} на серии ${run.streak}.`;
  run = null;
  save(); render();
}

el('go').onclick    = () => run ? haggle() : toMarket();
el('bank').onclick  = bank;
el('build').onclick = e => {
  const k = e.target.dataset?.buy;
  if (!k || busy) return;
  const cost = costOf(k);
  if (S.gold < cost) return;
  S.gold -= cost;
  S.own[k]++;
  el('msg').textContent = `${BALANCE.buildings[k].name} построена.`;
  save(); render();
};
el('reset').onclick = () => {
  if (!confirm('Сбросить прогресс прототипа?')) return;
  try { localStorage.removeItem(KEY) } catch {}
  location.reload();
};

accrue(); render(); save();
setInterval(() => { accrue(); render(); save() }, 1000);
</script>
</body>
</html>
