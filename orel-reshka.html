<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090510">
  <title>Орёл или решка — aka-gst</title>
  <link rel="stylesheet" href="/game-menu.css?v=1">
    <script defer src="/pulse/script.js" data-website-id="de024048-c4c3-4639-bbdf-808c558f6d71"></script>
  <style>
    :root{color-scheme:dark;--green:#76ff9f;--violet:#bc70ff;--gold:#ffe06b;--ink:#090510}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{min-width:320px;background:radial-gradient(circle at 50% 15%,#45205f,#120a1c 48%,var(--ink));color:#f6edff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.game{position:relative;width:100%;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:18px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:900 clamp(28px,5vw,52px)/.85 system-ui,sans-serif;letter-spacing:-.07em}.brand span{color:var(--green);text-shadow:3px 3px #633180}.home{position:relative;z-index:20}.home summary{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--green);background:#0b160f;color:#fff;cursor:pointer;list-style:none}.home summary::-webkit-details-marker{display:none}.home a{position:absolute;right:0;top:39px;padding:9px 11px;border:1px solid var(--green);background:#0b160ff5;color:#fff;font-size:9px;text-decoration:none;white-space:nowrap}.arena{min-height:0;display:grid;grid-template-columns:minmax(180px,1fr) minmax(260px,420px) minmax(180px,1fr);align-items:center;gap:clamp(14px,4vw,60px);max-width:1100px;width:100%;margin:auto}.panel{padding:16px;border:1px solid #a867e066;background:#110b19cc}.stats{display:grid;gap:13px}.stat small,.leaders small{display:block;color:#b7a7c4;font-size:9px;letter-spacing:.1em}.stat strong{display:block;margin-top:4px;color:var(--gold);font-size:clamp(25px,4vw,44px)}.leaders{align-self:stretch}.periods{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin:9px 0}.periods button{min-height:25px;padding:3px;border:1px solid #725089;background:#171020;color:#b7a7c4;font-size:7px;letter-spacing:.04em;box-shadow:none}.periods button.active{border-color:var(--green);color:var(--green);background:#153323}.leaders ol{margin:7px 0 0;padding:0;list-style:none;display:grid;gap:7px}.leaders li{display:flex;justify-content:space-between;gap:8px;font-size:10px}.leaders b{color:var(--green)}.center{display:grid;justify-items:center;gap:20px}.coin-wrap{width:min(42vh,280px);height:min(42vh,280px);perspective:1000px}.coin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.55s cubic-bezier(.2,.7,.15,1)}.side{position:absolute;inset:0;display:grid;place-items:center;border:7px double #ffe88d;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:radial-gradient(circle at 32% 24%,#fff8 0 5%,transparent 6%),radial-gradient(circle,#f8d66c,#9d641c 70%);box-shadow:inset -18px -18px 25px #5b310e88,0 0 30px #ffe36b44;color:#251203;font:900 clamp(26px,6vw,52px)/1 system-ui,sans-serif;text-shadow:1px 1px #fff7}.tails{transform:rotateY(180deg);background:radial-gradient(circle at 32% 24%,#fff 0 5%,transparent 6%),radial-gradient(circle,#d8dce4,#687080 70%)}.controls{width:100%;display:grid;gap:10px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice input{position:absolute;opacity:0}.choice label,#flip{min-height:48px;display:grid;place-items:center;border:1px solid #725089;background:#171020;color:#eee3f6;font:800 11px ui-monospace,monospace;cursor:pointer}.choice input:checked+label{border-color:var(--gold);background:#4d3b13;color:#fff6b7;box-shadow:0 0 14px #ffd84b30}#flip{border:2px solid var(--green);background:#194d31;color:#fff;font-size:14px;letter-spacing:.08em;box-shadow:4px 4px #050207}#flip:disabled{opacity:.55}.message{min-height:19px;margin:0;text-align:center;color:#d9cce2;font-size:11px}.foot{display:flex;justify-content:center;color:#7f718b;font-size:8px;letter-spacing:.11em}.coin.flipping{filter:drop-shadow(0 0 22px #bc70ff)}
    @media(max-width:760px){.game{padding:10px;gap:5px}.brand{font-size:30px}.arena{grid-template:64px minmax(0,1fr) auto/1fr;gap:5px}.stats{grid-row:1;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:7px}.stat strong{font-size:20px}.center{grid-row:2;gap:8px}.coin-wrap{width:min(48vw,32vh);height:min(48vw,32vh)}.controls{gap:6px}.choice label,button{min-height:42px}.leaders{grid-row:3;padding:6px}.leaders ol{grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}.leaders li{font-size:8px}.leaders li:nth-child(n+4){display:none}.foot{display:none}}
    @media(max-height:520px) and (orientation:landscape){.game{padding:5px}.top{position:absolute;inset:5px 5px auto;z-index:10}.brand{font-size:24px}.arena{grid-template:1fr/150px minmax(180px,300px) 180px;gap:7px}.stats{display:grid;grid-template-columns:1fr;padding:7px}.center{gap:5px}.coin-wrap{width:min(42vh,190px);height:min(42vh,190px)}.choice label,button{min-height:31px;font-size:9px}.message{font-size:8px}.leaders{padding:7px}.leaders ol{display:grid;grid-template-columns:1fr}.foot{display:none}}
  </style>
  <style>@media(min-width:1800px) and (min-height:850px){.game{padding:clamp(28px,2vw,52px)}.brand{font-size:clamp(58px,3.7vw,88px)}.arena{max-width:min(1680px,92vw);grid-template-columns:minmax(280px,1fr) minmax(480px,680px) minmax(280px,1fr);gap:clamp(36px,4vw,86px)}.panel{padding:clamp(24px,1.6vw,38px)}.stat small,.leaders small{font-size:clamp(13px,.75vw,17px)}.stat strong{font-size:clamp(48px,3vw,72px)}.coin-wrap{width:min(52dvh,460px);height:min(52dvh,460px)}.choice label,#flip{min-height:64px;font-size:clamp(15px,.9vw,20px)}.message{min-height:30px;font-size:clamp(15px,.85vw,19px)}.periods button{min-height:40px;font-size:clamp(10px,.62vw,14px)}.leaders li{font-size:clamp(13px,.75vw,17px)}}</style>
</head>
<body>
  <main class="game">
    <header class="top"><div class="brand"><span>ОРЁЛ</span> / РЕШКА</div><a class="game-home-menu" href="/">НА ГЛАВНУЮ</a></header>
    <section class="arena">
      <aside class="panel stats"><div class="stat"><small>ТЕКУЩАЯ СЕРИЯ</small><strong id="current">0</strong></div><div class="stat"><small>ЛУЧШАЯ СЕРИЯ</small><strong id="best">0</strong></div></aside>
      <div class="center"><div class="coin-wrap"><div id="coin" class="coin"><div class="side heads">ОРЁЛ</div><div class="side tails">РЕШКА</div></div></div><div class="controls"><div class="choice"><input type="radio" id="heads" name="bet" value="heads" checked><label for="heads">ОРЁЛ</label><input type="radio" id="tails" name="bet" value="tails"><label for="tails">РЕШКА</label></div><button id="flip">БРОСИТЬ МОНЕТУ</button><p id="message" class="message">Выбери сторону и испытай удачу.</p></div></div>
      <aside class="panel leaders"><small>ГЛОБАЛЬНЫЙ ТОП</small><div class="periods" aria-label="Период рейтинга"><button class="active" data-period="today">СЕГОДНЯ</button><button data-period="week">НЕДЕЛЯ</button><button data-period="month">МЕСЯЦ</button><button data-period="all">ВСЁ ВРЕМЯ</button></div><ol id="leaders"><li>Рекордов пока нет</li></ol></aside>
    </section>
    <footer class="foot">AKA-GST · COIN PROTOCOL</footer>
  </main>
  <script>
    // Запись рекордов временно выключена: страница только читает общий топ.
    let current=0,best=Number(localStorage.getItem('coin-flip-best')||0),rotation=0,audio,leaderPeriod='today';
    const coin=document.querySelector('#coin'),button=document.querySelector('#flip'),message=document.querySelector('#message'),currentEl=document.querySelector('#current'),bestEl=document.querySelector('#best'),leaders=document.querySelector('#leaders');bestEl.textContent=best;
    function tone(frequency,duration=90){const Engine=window.AudioContext||window.webkitAudioContext;if(!Engine)return;audio||=new Engine();if(audio.state==='suspended')void audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=frequency;o.type='triangle';g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration/1000);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration/1000)}
    function haptic(pattern){try{navigator.vibrate?.(pattern)}catch{}}
    function resumeAudio(){if(audio?.state==='suspended')void audio.resume().catch(()=>{})}
    ['pointerdown','touchstart','keydown','pageshow'].forEach(type=>window.addEventListener(type,resumeAudio,{passive:true}));document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeAudio()});
    // Ники пишут игроки, поэтому в разметку они не попадают никогда — только textContent.
    function note(text){const li=document.createElement('li');li.textContent=text;leaders.replaceChildren(li)}
    function renderLeaders(scores){leaders.replaceChildren(...scores.map((e,i)=>{const li=document.createElement('li'),who=document.createElement('span'),score=document.createElement('b');who.textContent=`${i+1}. ${e.nickname}`;score.textContent=e.score;li.append(who,score);return li}))}
    async function loadLeaders(period=leaderPeriod){leaderPeriod=period;try{const data=await fetch(`/api/leaderboard/scores?game=coin-flip&period=${period}&limit=9`).then(r=>r.json());data.scores?.length?renderLeaders(data.scores):note('Рекордов пока нет')}catch{note('Не удалось загрузить')}}
    document.querySelectorAll('.periods button').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.periods button').forEach(item=>item.classList.toggle('active',item===tab));void loadLeaders(tab.dataset.period)});
    button.onclick=()=>{const bet=document.querySelector('input[name="bet"]:checked').value,result=Math.random()<.5?'heads':'tails';button.disabled=true;message.textContent='Монета в воздухе…';haptic(18);tone(420,140);rotation+=6*360+(result==='tails'?180:0)-(rotation%360);coin.classList.add('flipping');coin.style.transform=`rotateY(${rotation}deg)`;setTimeout(()=>{button.disabled=false;coin.classList.remove('flipping');if(result===bet){current++;message.textContent='Угадал! Серия продолжается.';message.style.color='#76ff9f';haptic([18,24,32]);tone(760,180)}else{current=0;message.textContent='Не угадал. Новая серия!';message.style.color='#ff718d';haptic([48,35,55]);tone(180,240)}if(current>best){best=current;localStorage.setItem('coin-flip-best',String(best))}currentEl.textContent=current;bestEl.textContent=best;window.umami?.track('coin-flip',{guess:bet,result,streak:current})},1550)};
    void loadLeaders();
  </script>
</body>
</html>
